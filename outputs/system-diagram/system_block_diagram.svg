ue data and staff actions</text><path d="M895 620 V755" fill="none" stroke="#414951" stroke-width="2" marker-end="url(#a)"/><text x="895" y="704" font-size="14" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round" fill="#333">Live queue and display settings</text><path d="M208 695 V710 H390" fill="none" stroke="#414951" stroke-width="2" marker-end="url(#a)"/><text x="299" y="692" font-size="14" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round" fill="#333">Eligibility verification</text><path d="M515 600 V525" fill="none" stroke="#414951" stroke-width="2" marker-end="url(#a)"/><text x="563" y="568" font-size="14" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round" fill="#333">Priority approval</text><path d="M645 655 H680 V510 H720" fill="none" stroke="#414951" stroke-width="2" marker-end="url(#a)"/><text x="680" y="637" font-size="14" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round" fill="#333">Verify code</text><path d="M375 525 V785 H495 V825" fill="none" stroke="#414951" stroke-width="2" marker-end="url(#a)"/><text x="405" y="778" font-size="14" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round" fill="#333">Signed receipt</text><text x="800" y="1040" text-anchor="middle" font-size="23" font-style="italic">Updated System Block Diagram of the Intelligent Queuing Management System</text><text x="800" y="1072" text-anchor="middle" font-size="18">Lyceum of Alabang</text></g></svg>